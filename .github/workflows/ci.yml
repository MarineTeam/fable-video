name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 defaults this to true, auto-caching npm state keyed off
          # package.json. This repo commits no lockfile on purpose (Vercel
          # installs fresh on deploy, and CI mirrors that — see below), so
          # there's nothing for that cache key to pin against; a stale/
          # incompatible restored cache was crashing npm's own dependency-
          # graph resolver ("Cannot read properties of null (reading
          # 'edgesOut')") on an install that succeeds cleanly uncached.
          package-manager-cache: false

      # No lockfile is committed by design — Vercel installs fresh on deploy,
      # and CI mirrors that. That fresh-every-time resolution is currently
      # hitting a known, unfixed npm bug in Arborist's peer-dependency tree
      # building (npm/cli#8261: "Cannot read properties of null (reading
      # 'edgesOut')") — reproduced 4/4 on this runner across two commits
      # (2026-09-04), including 3 identical failures inside one retry loop,
      # while a local install against the same package.json — same OS/arch,
      # same npm version, direct (unproxied) registry access confirmed on
      # both sides — succeeded every time. Retrying alone (kept below as a
      # safety net for genuinely transient failures) did not clear it: this
      # looks tied to something about this specific runner's resolution
      # (registry CDN edge / fetch-completion ordering are the leading
      # theories), not a one-off blip. --loglevel=verbose is TEMPORARY,
      # added only to capture what the crash actually touches server-side —
      # remove it once that's diagnosed and a real fix (a version pin, most
      # likely) replaces this comment.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm install --loglevel=verbose && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm install failed after 3 attempts" >&2
              exit 1
            fi
            echo "npm install failed (attempt $attempt/3) — retrying" >&2
            rm -rf node_modules
            sleep 5
          done

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH0_SECRET: 6f0f2c9a4d1e8b37c5a2f4d6e8091b3d5f7a9c1e3b5d7f90a2c4e6081b3d5f70
          AUTH0_DOMAIN: example.us.auth0.com
          AUTH0_CLIENT_ID: ci-client-id
          AUTH0_CLIENT_SECRET: ci-client-secret
          APP_BASE_URL: http://localhost:3000
          ADMIN_EMAILS: admin@example.com
          BUNNY_LIBRARY_ID: "1"
          BUNNY_API_KEY: ci-dummy-key
          BUNNY_TOKEN_AUTH_KEY: ci-dummy-token
          KV_REST_API_URL: https://ci-dummy.upstash.io
          KV_REST_API_TOKEN: ci-dummy
