name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 defaults this to true, auto-caching npm state keyed off
          # package.json. This repo commits no lockfile on purpose (Vercel
          # installs fresh on deploy, and CI mirrors that — see below), so
          # there's nothing for that cache key to pin against; a stale/
          # incompatible restored cache was crashing npm's own dependency-
          # graph resolver ("Cannot read properties of null (reading
          # 'edgesOut')") on an install that succeeds cleanly uncached.
          package-manager-cache: false

      # The npm bundled with Node 22.23.2's actions/setup-node image (10.9.8
      # as of 2026-09-04) hits a known Arborist bug during this repo's
      # install — a crash deep in peer-dependency resolution, unrelated to
      # anything in package.json (confirmed: identical crash across 6
      # attempts spanning 45+ minutes and 3 prior targeted fixes —
      # disabling the cache above, a retry loop, and pinning the one
      # package that looked implicated by the crash's own log proximity —
      # none of which cleared it). A local install with the runner's exact
      # npm version, Node version, OS and architecture never reproduced it,
      # and Vercel's own build of every one of those same commits succeeded
      # — so this is specific to whatever this npm build does differently,
      # not this repo's dependency graph.
      #
      # `npx npm@latest install` — NOT `npm install -g npm@latest` — runs a
      # fresh copy of npm's latest release from npx's isolated cache without
      # touching the runner's actual npm installation. That distinction is
      # load-bearing: an in-place `npm install -g npm@latest` self-replaces
      # the very files the running npm process is executing from, and was
      # confirmed locally to leave npm broken (a bare `npm -v` afterward
      # failed with a missing-module error) — trading one CI failure mode
      # for a worse one. `npx`'s isolation avoids that entirely, and every
      # subsequent step keeps using the runner's own unmodified npm (10.9.8)
      # to run already-installed scripts, which never touched this bug —
      # only dependency resolution did.
      #
      # No lockfile is committed by design — Vercel installs fresh on
      # deploy, and CI mirrors that. The retry loop is a general safety net
      # for ordinary transient registry hiccups, independent of the npm
      # version pin above.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npx --yes npm@latest install && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm install failed after 3 attempts" >&2
              exit 1
            fi
            echo "npm install failed (attempt $attempt/3) — retrying" >&2
            rm -rf node_modules
            sleep 5
          done

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH0_SECRET: 6f0f2c9a4d1e8b37c5a2f4d6e8091b3d5f7a9c1e3b5d7f90a2c4e6081b3d5f70
          AUTH0_DOMAIN: example.us.auth0.com
          AUTH0_CLIENT_ID: ci-client-id
          AUTH0_CLIENT_SECRET: ci-client-secret
          APP_BASE_URL: http://localhost:3000
          ADMIN_EMAILS: admin@example.com
          BUNNY_LIBRARY_ID: "1"
          BUNNY_API_KEY: ci-dummy-key
          BUNNY_TOKEN_AUTH_KEY: ci-dummy-token
          KV_REST_API_URL: https://ci-dummy.upstash.io
          KV_REST_API_TOKEN: ci-dummy
